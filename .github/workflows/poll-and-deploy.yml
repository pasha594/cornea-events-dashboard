name: Poll feed and deploy

on:
  schedule:
    # Every 5 minutes (GitHub's minimum, and the feed's CDN cache lifetime), offset
    # from the top of the hour when GitHub's scheduler is busiest.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll-and-deploy
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      gap: ${{ steps.poll.outputs.gap }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch feed and merge new events
        id: poll
        run: python3 scripts/poll.py

      - name: Commit new events
        id: commit
        run: |
          if [ -z "$(git status --porcelain site/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Store new feed events"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: poll
    # Scheduled runs only redeploy when new events were stored.
    if: needs.poll.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # include the data commit the poll job just pushed

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

  # Runs after the data is saved and deployed, and fails on purpose so GitHub
  # sends a failed-run notification instead of the gap passing silently.
  report-gap:
    needs: [poll, deploy]
    if: always() && needs.poll.outputs.gap == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report missed events
        run: |
          echo "::error title=Events may have been missed::More than 100 events arrived between two polls, so the feed dropped some before they could be stored. The gap is recorded in site/data/manifest.json and shown on the dashboard."
          exit 1
